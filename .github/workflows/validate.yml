name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          pip install -r requirements_test.txt ruff
          pip install "$(python -c "import json,homeassistant.components.frontend as f,os;print([r for r in json.load(open(os.path.join(os.path.dirname(f.__file__),'manifest.json')))['requirements'] if r.startswith('home-assistant-frontend')][0])")"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q
